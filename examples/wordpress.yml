# Example: WordPress with Traefik

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - traefik-proxy
      - wordpress-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      
      # Main router for WordPress
      - "traefik.http.routers.wordpress.rule=Host(`blog.${DOMAIN}`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=cloudflare"
      
      # Service configuration
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"
      
      # Middleware: security headers + compression
      - "traefik.http.routers.wordpress.middlewares=wordpress-security,compress"
      - "traefik.http.middlewares.wordpress-security.headers.framedeny=true"
      - "traefik.http.middlewares.wordpress-security.headers.browserxssfilter=true"
      - "traefik.http.middlewares.wordpress-security.headers.contenttypenosniff=true"

  db:
    image: mysql:8.0
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress-internal
    command: '--default-authentication-plugin=mysql_native_password'

networks:
  traefik-proxy:
    external: true
  wordpress-internal:
    driver: bridge

volumes:
  wordpress_data:
  db_data:
